name: Arabic native accessibility resources and Android 16 re-sign

on:
  push:
    branches: [delonghi-arabic-talkback-apk]
    paths: [.github/workflows/patch-arabic-sign.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arabic-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: delonghi-arabic-talkback-apk
      - name: Apply ar-SA Android string resources
        shell: bash
        run: |
          set -euo pipefail
          FILE=releases/DeLonghi_MyCoffeeLounge_Arabic_ARM64_APK_Repaired_Experimental.apk
          mkdir -p /tmp/delonghi-sign
          python3 tools/patch_native_arabic.py "$FILE" /tmp/delonghi-sign/native-ar-unsigned.apk | tee /tmp/delonghi-sign/translation.txt
          test -s /tmp/delonghi-sign/native-ar-unsigned.apk
          python3 - "$FILE" /tmp/delonghi-sign/native-ar-unsigned.apk <<'PY'
          import sys,zipfile,hashlib,re
          def hashes(f):
              with zipfile.ZipFile(f) as z:
                  assert z.testzip() is None
                  return {n:hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if not re.match(r'^META-INF/[^/]+\.(?:SF|RSA|DSA|EC|MF)$',n,re.I)}
          old,new=map(hashes,sys.argv[1:])
          assert old.keys()==new.keys(),'ZIP payload file list unexpectedly changed'
          changed=[k for k in old if old[k]!=new[k]]
          assert changed==['resources.arsc'],f'Unexpected payload changed: {changed}'
          print('Verified exactly one modified payload entry:',changed)
          PY
      - name: Official Android SDK structural validation
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/build-tools/35.0.0/apksigner" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null
          fi
          BUILD="$SDK/build-tools/35.0.0"
          "$BUILD/aapt" dump badging /tmp/delonghi-sign/native-ar-unsigned.apk | head -n 12
          "$BUILD/aapt" dump resources /tmp/delonghi-sign/native-ar-unsigned.apk > /tmp/delonghi-sign/resources.txt
          grep -E -i 'ar-rSA|ar_SA|arSA' /tmp/delonghi-sign/resources.txt | head -n 8 || true
          "$BUILD/zipalign" -f -p 4 /tmp/delonghi-sign/native-ar-unsigned.apk /tmp/delonghi-sign/aligned.apk
          "$BUILD/zipalign" -c -v 4 /tmp/delonghi-sign/aligned.apk | tail -n 3
      - name: New Android v2/v3 signature and verification
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD="$SDK/build-tools/35.0.0"
          SECRET="$(openssl rand -hex 24)"
          keytool -genkeypair -keyalg RSA -keysize 3072 -validity 3650 \
            -alias private-test -keystore /tmp/delonghi-sign/key.p12 -storetype PKCS12 \
            -storepass "$SECRET" -keypass "$SECRET" -noprompt \
            -dname 'CN=Private DeLonghi Arabic Accessibility Test, O=Independent Testing, C=SA' >/dev/null 2>&1
          "$BUILD/apksigner" sign \
            --ks /tmp/delonghi-sign/key.p12 --ks-key-alias private-test \
            --ks-pass "pass:$SECRET" --key-pass "pass:$SECRET" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --v4-signing-enabled false \
            --out /tmp/delonghi-sign/final.apk /tmp/delonghi-sign/aligned.apk
          "$BUILD/apksigner" verify --verbose --print-certs --min-sdk-version 24 /tmp/delonghi-sign/final.apk > /tmp/delonghi-sign/verified-24.txt
          "$BUILD/apksigner" verify --verbose --print-certs --min-sdk-version 36 /tmp/delonghi-sign/final.apk > /tmp/delonghi-sign/verified-36.txt
          cat /tmp/delonghi-sign/verified-36.txt
          "$BUILD/aapt" dump badging /tmp/delonghi-sign/final.apk >/dev/null
          FILE=releases/DeLonghi_MyCoffeeLounge_Arabic_ARM64_APK_Repaired_Experimental.apk
          cp /tmp/delonghi-sign/final.apk "$FILE"
          {
            echo 'Experimental APK, not an official DeLonghi product.'
            echo 'Native Android ar-SA strings are now present.'
            echo 'Flutter is still using en-US fallback translated to Arabic; this does NOT guarantee Flutter RTL or TalkBack access.'
            echo 'Android install and machine login are NOT verified on a real ARM64 device.'
            echo ''
            sha256sum "$FILE"
            echo ''
            cat /tmp/delonghi-sign/translation.txt
            echo ''
            echo 'Official apksigner verification SDK 24:'
            cat /tmp/delonghi-sign/verified-24.txt
            echo ''
            echo 'Official apksigner verification SDK 36:'
            cat /tmp/delonghi-sign/verified-36.txt
          } > releases/DeLonghi_Android16_Signing_Verification.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE" releases/DeLonghi_Android16_Signing_Verification.txt
          git commit -m 'Add Android ar-SA native strings and re-sign APK for Android 16'
          git push origin HEAD:delonghi-arabic-talkback-apk
