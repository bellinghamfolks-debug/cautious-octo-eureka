name: Android CI

on:
  push:
    branches: [main, master, "codex/**", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane. Skips the native VLM build so lint, unit tests and Kotlin
  # compilation errors surface in minutes rather than after a llama.cpp compile.
  # The APK it produces is cloud-only and is not the shippable artifact.
  build:
    name: Lint, tests, and ARM64 debug APK (cloud engine only)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify repository structure and secrets
        run: python3 scripts/verify_project.py

      - name: Lint, unit tests, and assemble
        shell: bash
        run: |
          source .github/gradle-retry.sh
          # `|| status=$?` keeps the step alive under `set -e` so the log is
          # always printed before the exit status is propagated.
          status=0
          gradle_with_network_retry build.log \
            -Pvisionbridge.enableLocalVlm=false \
            lintDebug testDebugUnitTest assembleDebug || status=$?
          cat build.log
          exit "$status"

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error
          retention-days: 3

      # This lane deliberately publishes no APK. It builds one only as a
      # compile check, and that APK has no libvisionbridge_vlm.so in it.
      #
      # It used to be uploaded, and because both lanes produce a file called
      # app-debug.apk, the one without the engine was installed by mistake and
      # the local model failed at runtime with "dlopen failed: library
      # libvisionbridge_vlm.so not found". There is now exactly one installable
      # artifact in the whole workflow, and its filename says what it is.

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Shippable lane. Compiles llama.cpp and libmtmd for arm64 and produces the APK
  # that actually honours the "Use local AI" switch. Runs only after the fast lane
  # is green, so a Kotlin typo never costs a native rebuild.
  native:
    name: ARM64 debug APK with on-device VLM engine
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK, NDK and CMake
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.0.12077973" "cmake;3.22.1"

      # The llama.cpp clone and its object files dominate this job. Keyed on the
      # pinned tag so a version bump invalidates the cache and nothing else does.
      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: native-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', 'app/src/main/cpp/vlm_bridge.cpp') }}
          restore-keys: native-${{ runner.os }}-

      - name: Assemble with local VLM engine
        shell: bash
        run: |
          source .github/gradle-retry.sh
          status=0
          gradle_with_network_retry native-build.log assembleDebug || status=$?
          tail -n 300 native-build.log
          exit "$status"

      - name: Confirm the APK carries arm64 only
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          libs=$(unzip -Z1 "$apk" 'lib/*' | cut -d/ -f2 | sort -u)
          echo "ABIs in APK: ${libs:-none}"
          if [ -z "$libs" ]; then
            echo "::error::No native library packaged; the local VLM engine is missing."
            exit 1
          fi
          if [ "$libs" != "arm64-v8a" ]; then
            echo "::error::Unexpected ABI packaged: $libs"
            exit 1
          fi

      - name: Upload native build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: native-build.log
          if-no-files-found: ignore
          retention-days: 3

      # Named so the file itself is self-identifying once downloaded, rather
      # than being another anonymous app-debug.apk in a Downloads folder.
      - name: Name the APK after the version and engine
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          name="VisionBridge-${version}-arm64-local-vlm.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Installable APK: $name ($(stat -c%s "$name") bytes)"

      - name: Upload the installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionBridge-arm64-debug-apk-with-local-vlm
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14

  diagnostics:
    name: Concise compiler diagnostics
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Download build log
        uses: actions/download-artifact@v4
        with:
          name: build-log

      - name: Print actionable errors
        shell: bash
        run: |
          echo "Actionable Gradle and Kotlin errors:"
          grep -E '(^e: |^w: |FAILURE:|What went wrong:|error:|Exception|Unresolved reference|Compilation error)' build.log | tail -n 200 || tail -n 200 build.log
