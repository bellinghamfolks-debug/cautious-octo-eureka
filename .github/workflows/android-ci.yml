name: Android validation

on:
  push:
    branches: [main, master, "codex/**", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # Frequent recovery checkpoints must not repeatedly abort the running device suite.
  # GitHub keeps the running validation and schedules the latest pending checkpoint.
  cancel-in-progress: false

# Development validation never publishes release APKs or creates release signing material.
# An explicitly marked candidate commit can package an isolated test app after both gates.
# A release requires separate device, grounding, privacy and measured performance acceptance.
jobs:
  build:
    name: Lint, unit tests and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate measurement harness
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Required project gate
        run: ./scripts/codex-check.sh
      - name: Upload synthetic test reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
  candidate:
    name: Package isolated device-test candidate
    needs: [build, device]
    if: github.ref == 'refs/heads/codex/visionbridge-frame-integrity' && contains(github.event.head_commit.message, '[device-candidate]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble isolated ARM64 test app
        run: ./gradlew --no-daemon lintValidation assembleValidation
      - name: Verify package identity and record provenance
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/validation/app-validation.apk > candidate-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, shutil
          badging = Path('candidate-badging.txt').read_text()
          assert "package: name='com.abdullah.visionbridge.validation'" in badging
          assert 'frame-repair-test2' in badging
          assert "native-code: 'arm64-v8a'" in badging
          apk = Path('app/build/outputs/apk/validation/app-validation.apk')
          name = 'VisionBridge-3.8.4-frame-repair-test2-arm64.apk'
          shutil.copyfile(apk, name)
          Path('candidate-info.txt').write_text(
              'DEVICE TEST CANDIDATE — NOT AN APPROVED RELEASE\n'
              'Installs separately as com.abdullah.visionbridge.validation.\n'
              'Phone/network latency and new cloud-output acceptance remain unverified.\n'
              'No private diagnostic evidence is included.\n'
              'commit=' + os.environ['GITHUB_SHA'] + '\n'
              'sha256=' + hashlib.sha256(apk.read_bytes()).hexdigest() + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-device-test-candidate
          path: |
            VisionBridge-3.8.4-frame-repair-test2-arm64.apk
            candidate-info.txt
          if-no-files-found: error
          retention-days: 30

  device:
    name: On-device tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetch and checksum the bundled PP-OCR models
        run: python3 scripts/fetch_ocr_models.py

      - name: Run the instrumented tests on a managed device
        shell: bash
        run: |
          source .github/gradle-retry.sh
          status=0
          gradle_with_network_retry device.log \
            pixel6Api30DebugAndroidTest \
            -Pvisionbridge.emulatorAbi=x86_64 \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect || status=$?
          cat device.log
          exit "$status"

      - name: Upload the device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: app/build/reports/androidTests/managedDevice/
          if-no-files-found: ignore
