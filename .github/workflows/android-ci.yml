name: Android CI

on:
  push:
    branches: [main, master, "codex/**", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One lane, one APK. The on-device reader is PP-OCRv5 running on the
  # ONNX Runtime Android AAR, so there is no C++ in this project any more and
  # nothing to compile beyond Kotlin. The two-lane split existed only because
  # llama.cpp took an hour to build; with that gone, the lane that runs the
  # tests is also the lane that produces the shippable artifact, which removes
  # the trap where two jobs each published a file called app-debug.apk and the
  # wrong one got installed.
  build:
    name: Lint, tests, and ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needed only by the release step below; everything else reads.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify repository structure and secrets
        run: python3 scripts/verify_project.py

      # Run before Gradle so a model-hosting outage is reported as itself rather
      # than as a mysterious Gradle failure. Gradle depends on the same task, so
      # this is a clearer error message, not a second download.
      - name: Fetch and checksum the bundled PP-OCR models
        run: python3 scripts/fetch_ocr_models.py

      - name: Confirm the models are staged for packaging
        run: python3 scripts/fetch_ocr_models.py --check

      - name: Lint, unit tests, and assemble
        shell: bash
        run: |
          source .github/gradle-retry.sh
          # `|| status=$?` keeps the step alive under `set -e` so the log is
          # always printed before the exit status is propagated.
          status=0
          gradle_with_network_retry build.log \
            lintDebug testDebugUnitTest assembleDebug || status=$?
          cat build.log
          exit "$status"

      - name: Confirm the APK carries arm64 only
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          libs=$(unzip -Z1 "$apk" 'lib/*' | cut -d/ -f2 | sort -u)
          echo "ABIs in APK: ${libs:-none}"
          if [ -z "$libs" ]; then
            echo "::error::No native library packaged; ONNX Runtime is missing from the APK."
            exit 1
          fi
          if [ "$libs" != "arm64-v8a" ]; then
            echo "::error::Unexpected ABI packaged: $libs"
            exit 1
          fi

      # The reader is useless without its models, and an APK missing them looks
      # perfectly healthy until a blind user turns local reading on. Checked here
      # rather than discovered on a phone.
      - name: Confirm the OCR models are inside the APK
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          for model in ppocr-det.onnx ppocr-rec-ar.onnx ppocr-rec-en.onnx ppocr-cls.onnx; do
            if ! unzip -Z1 "$apk" "assets/ppocr/$model" >/dev/null 2>&1; then
              echo "::error::$model is not packaged in the APK"
              exit 1
            fi
            echo "packaged: assets/ppocr/$model"
          done

      # Named so the file itself is self-identifying once downloaded, rather
      # than being another anonymous app-debug.apk in a Downloads folder.
      - name: Name the APK after the version
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          name="VisionBridge-${version}-arm64.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Installable APK: $name ($(stat -c%s "$name") bytes)"

      - name: Upload the installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionBridge-arm64-debug-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14

      # Downloading a workflow artifact means navigating into a run page, finding the
      # artifacts section, and unzipping what arrives. With a screen reader that is a
      # long walk for a file. A release gives one unchanging address that downloads the
      # APK directly:
      #
      #   https://github.com/<owner>/<repo>/releases/latest/download/VisionBridge.apk
      #
      # Two assets go up: VisionBridge.apk, whose name never changes so the link above
      # keeps working, and the versioned name, so a file sitting in a Downloads folder
      # still says which build it is.
      - name: Publish the APK to a release with a stable download link
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          build=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          tag="v${version}"
          cp app/build/outputs/apk/debug/app-debug.apk VisionBridge.apk

          notes=$(printf '%s\n' \
            "الإصدار ${version}، Build ${build}" \
            "" \
            "التنزيل المباشر: VisionBridge.apk" \
            "" \
            "بعد التثبيت افتح الإعدادات، وسيظهر في أعلى الشاشة: الإصدار ${version}، Build ${build}." \
            "" \
            "commit: ${GITHUB_SHA}")

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" VisionBridge.apk "${{ steps.apk.outputs.name }}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "VisionBridge ${version} (Build ${build})" --notes "$notes" --latest
          else
            gh release create "$tag" VisionBridge.apk "${{ steps.apk.outputs.name }}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "VisionBridge ${version} (Build ${build})" --notes "$notes" --latest
          fi
          echo "Stable link: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/VisionBridge.apk"

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # A separate job on purpose. Booting an emulator is infrastructure, and coupling it to the APK
  # means an emulator that will not start stops releases -- which is what happened the first time
  # this ran: the standard runner has no KVM, so an x86 image cannot boot at all. Split, a device
  # failure still fails the run, so the signal is not lost, while the APK is still produced.
  device:
    name: On-device tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Without this the emulator reports "x86 emulation currently requires hardware acceleration"
      # and never boots. The device node exists on the runner but is not readable by the build user.
      - name: Grant access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || echo "no /dev/kvm on this runner"

      - name: Fetch and checksum the bundled PP-OCR models
        run: python3 scripts/fetch_ocr_models.py

      - name: Run the instrumented tests on a managed device
        shell: bash
        run: |
          source .github/gradle-retry.sh
          status=0
          gradle_with_network_retry device.log \
            pixel6Api30DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect || status=$?
          cat device.log
          exit "$status"

      - name: Upload the device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: app/build/reports/androidTests/managedDevice/
          if-no-files-found: ignore

  diagnostics:
    name: Concise compiler diagnostics
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Download build log
        uses: actions/download-artifact@v4
        with:
          name: build-log

      - name: Print actionable errors
        shell: bash
        run: |
          echo "Actionable Gradle and Kotlin errors:"
          grep -E '(^e: |^w: |FAILURE:|What went wrong:|error:|Exception|Unresolved reference|Compilation error)' build.log | tail -n 200 || tail -n 200 build.log
