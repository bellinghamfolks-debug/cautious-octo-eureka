name: Android validation

on:
  push:
    branches: [main, master, "codex/**", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # Frequent recovery checkpoints must not repeatedly abort the running device suite.
  # GitHub keeps the running validation and schedules the latest pending checkpoint.
  cancel-in-progress: false

# Development validation never publishes release APKs or creates release signing material.
# An explicitly marked candidate commit can package an isolated test app after both gates.
# A release requires separate device, grounding, privacy and measured performance acceptance.
jobs:
  build:
    name: Lint, unit tests and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate measurement harness
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Required project gate
        run: ./scripts/codex-check.sh
      - name: Upload synthetic test reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
  candidate:
    name: Package isolated device-test candidate
    needs: [build, device]
    if: github.ref == 'refs/heads/codex/visionbridge-frame-integrity' && contains(github.event.head_commit.message, '[device-candidate]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Needed only by the release step below; every other step reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble isolated ARM64 test app
        run: ./gradlew --no-daemon lintValidation assembleValidation
      - name: Verify package identity and record provenance
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/validation/app-validation.apk > candidate-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re, shutil
          badging = Path('candidate-badging.txt').read_text()
          assert "package: name='com.abdullah.visionbridge.stable'" in badging
          assert "native-code: 'arm64-v8a'" in badging
          # Read the version out of the APK instead of pinning it here. The pinned string was
          # 'stable-signing-test5', so build 49's live-transport repair assembled cleanly and then
          # failed this assert, the upload was skipped, and the newest installable APK stayed at
          # build 48 for every field report that followed. What has to hold is that this is an
          # isolated test package and not a release — the number is whatever was just built.
          version = re.search(r"versionName='([^']*)'", badging).group(1)
          code = re.search(r"versionCode='([^']*)'", badging).group(1)
          assert re.search(r'-stable-signing-test\d+$', version), (
              f'candidate {version} is not an isolated signing-test build')
          apk = Path('app/build/outputs/apk/validation/app-validation.apk')
          name = f'VisionBridge-{version}-arm64.apk'
          shutil.copyfile(apk, name)
          print(f'::notice::packaged {name} (versionCode {code})')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'CANDIDATE_APK={name}\n')
              env.write(f'CANDIDATE_VERSION={version}\n')
              env.write(f'CANDIDATE_BUILD={code}\n')
          Path('candidate-info.txt').write_text(
              'DEVICE TEST CANDIDATE — NOT AN APPROVED RELEASE\n'
              'Candidate package: com.abdullah.visionbridge.stable; final APK must use the pinned private signer.\n'
              'Phone/network latency and new cloud-output acceptance remain unverified.\n'
              'No private diagnostic evidence is included.\n'
              'commit=' + os.environ['GITHUB_SHA'] + '\n'
              'sha256=' + hashlib.sha256(apk.read_bytes()).hexdigest() + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-device-test-candidate
          path: |
            VisionBridge-*-arm64.apk
            candidate-info.txt
          if-no-files-found: error
      # Reaching a workflow artifact means signing in to GitHub, walking into a run page,
      # finding the artifacts section and unzipping what arrives. With a screen reader that
      # is a long walk for a file, and the whole point of this job is that someone can
      # install the build. A release asset is one address that downloads the APK directly
      # and never changes:
      #
      #   https://github.com/<owner>/<repo>/releases/download/device-candidate/VisionBridge.apk
      #
      # The tag is fixed rather than versioned so that address keeps working, and the
      # release stays a prerelease and is never marked latest, so a test candidate signed
      # with the debug key cannot be mistaken for an approved release.
      - name: Publish the candidate to a fixed download address
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$CANDIDATE_APK" VisionBridge.apk
          notes=$(printf '%s\n' \
            "مرشّح اختبار على الجهاز — ليس إصداراً معتمداً." \
            "" \
            "الإصدار ${CANDIDATE_VERSION}، Build ${CANDIDATE_BUILD}" \
            "" \
            "التنزيل المباشر: VisionBridge.apk" \
            "" \
            "الحزمة com.abdullah.visionbridge.stable وتُثبَّت بجانب التطبيق الأساسي دون استبداله." \
            "موقَّعة بمفتاح الاختبار، لا بمفتاح الإصدار." \
            "" \
            "commit: ${GITHUB_SHA}")
          if gh release view device-candidate --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload device-candidate VisionBridge.apk "$CANDIDATE_APK" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit device-candidate --repo "$GITHUB_REPOSITORY" \
              --title "VisionBridge ${CANDIDATE_VERSION} (Build ${CANDIDATE_BUILD}) — device candidate" \
              --notes "$notes" --prerelease
          else
            gh release create device-candidate VisionBridge.apk "$CANDIDATE_APK" \
              --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "VisionBridge ${CANDIDATE_VERSION} (Build ${CANDIDATE_BUILD}) — device candidate" \
              --notes "$notes"
          fi
          retention-days: 30

  device:
    name: On-device tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetch and checksum the bundled PP-OCR models
        run: python3 scripts/fetch_ocr_models.py

      - name: Run the instrumented tests on a managed device
        shell: bash
        run: |
          source .github/gradle-retry.sh
          status=0
          gradle_with_network_retry device.log \
            pixel6Api30DebugAndroidTest \
            -Pvisionbridge.emulatorAbi=x86_64 \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect || status=$?
          cat device.log
          exit "$status"

      - name: Upload the device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: app/build/reports/androidTests/managedDevice/
          if-no-files-found: ignore
