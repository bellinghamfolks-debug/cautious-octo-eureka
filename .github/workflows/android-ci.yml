name: Android validation

on:
  push:
    branches: [main, master, "codex/**", "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Development validation never publishes APKs or creates signing material.
# A release requires separate device, grounding, privacy and measured performance acceptance.
jobs:
  build:
    name: Lint, unit tests and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate measurement harness
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Required project gate
        run: ./scripts/codex-check.sh
      - name: Upload synthetic test reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7

  device:
    name: On-device tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fetch and checksum the bundled PP-OCR models
        run: python3 scripts/fetch_ocr_models.py

      - name: Run the instrumented tests on a managed device
        shell: bash
        run: |
          source .github/gradle-retry.sh
          status=0
          gradle_with_network_retry device.log \
            pixel6Api30DebugAndroidTest \
            -Pvisionbridge.emulatorAbi=x86_64 \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect || status=$?
          cat device.log
          exit "$status"

      - name: Upload the device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: app/build/reports/androidTests/managedDevice/
          if-no-files-found: ignore
