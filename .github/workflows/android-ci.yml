name: Android CI

on:
  push:
    branches: [main, master, "codex/**", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One lane, one APK. The on-device reader is PP-OCRv5 running on the
  # ONNX Runtime Android AAR, so there is no C++ in this project any more and
  # nothing to compile beyond Kotlin. The two-lane split existed only because
  # llama.cpp took an hour to build; with that gone, the lane that runs the
  # tests is also the lane that produces the shippable artifact, which removes
  # the trap where two jobs each published a file called app-debug.apk and the
  # wrong one got installed.
  build:
    name: Lint, tests, and ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify repository structure and secrets
        run: python3 scripts/verify_project.py

      - name: Lint, unit tests, and assemble
        shell: bash
        run: |
          source .github/gradle-retry.sh
          # `|| status=$?` keeps the step alive under `set -e` so the log is
          # always printed before the exit status is propagated.
          status=0
          gradle_with_network_retry build.log \
            lintDebug testDebugUnitTest assembleDebug || status=$?
          cat build.log
          exit "$status"

      - name: Confirm the APK carries arm64 only
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          libs=$(unzip -Z1 "$apk" 'lib/*' | cut -d/ -f2 | sort -u)
          echo "ABIs in APK: ${libs:-none}"
          if [ -z "$libs" ]; then
            echo "::error::No native library packaged; ONNX Runtime is missing from the APK."
            exit 1
          fi
          if [ "$libs" != "arm64-v8a" ]; then
            echo "::error::Unexpected ABI packaged: $libs"
            exit 1
          fi

      # Named so the file itself is self-identifying once downloaded, rather
      # than being another anonymous app-debug.apk in a Downloads folder.
      - name: Name the APK after the version
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          name="VisionBridge-${version}-arm64.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Installable APK: $name ($(stat -c%s "$name") bytes)"

      - name: Upload the installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VisionBridge-arm64-debug-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: error
          retention-days: 3

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  diagnostics:
    name: Concise compiler diagnostics
    needs: build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Download build log
        uses: actions/download-artifact@v4
        with:
          name: build-log

      - name: Print actionable errors
        shell: bash
        run: |
          echo "Actionable Gradle and Kotlin errors:"
          grep -E '(^e: |^w: |FAILURE:|What went wrong:|error:|Exception|Unresolved reference|Compilation error)' build.log | tail -n 200 || tail -n 200 build.log
