name: Experiment - force Flutter to load Arabic asset

on:
  push:
    branches: [delonghi-arabic-talkback-apk]
    paths: [.github/workflows/test-flutter-arabic-route.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-arabic-route:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: delonghi-arabic-talkback-apk

      - name: Modify only Dart AOT translation asset lookup and asset manifest
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=releases/DeLonghi_MyCoffeeLounge_Arabic_ARM64_APK_Repaired_Experimental.apk
          mkdir -p /tmp/delonghi-exp
          python3 tools/patch_flutter_arabic_asset_route.py "$SOURCE" /tmp/delonghi-exp/unsigned.apk | tee /tmp/delonghi-exp/patch-output.txt

      - name: Android SDK resource analysis and APK alignment
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/build-tools/35.0.0/apksigner" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" >/dev/null
          fi
          BUILD="$SDK/build-tools/35.0.0"
          "$BUILD/aapt" dump badging /tmp/delonghi-exp/unsigned.apk >/tmp/delonghi-exp/badging.txt
          "$BUILD/zipalign" -f -p 4 /tmp/delonghi-exp/unsigned.apk /tmp/delonghi-exp/aligned.apk
          "$BUILD/zipalign" -c -v 4 /tmp/delonghi-exp/aligned.apk | tail -n 3

      - name: Sign with new TEST certificate and verify under Android 16
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD="$SDK/build-tools/35.0.0"
          PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -keyalg RSA -keysize 3072 -validity 3650 \
            -alias test -keystore /tmp/delonghi-exp/key.p12 -storetype PKCS12 \
            -storepass "$PASSWORD" -keypass "$PASSWORD" -noprompt \
            -dname 'CN=Experimental Flutter Arabic Route, OU=Accessibility research, O=Independent Test, C=SA' >/dev/null 2>&1
          OUT=releases/DeLonghi_Arabic_AssetPath_Experiment.apk
          "$BUILD/apksigner" sign --ks /tmp/delonghi-exp/key.p12 \
            --ks-key-alias test --ks-pass "pass:$PASSWORD" --key-pass "pass:$PASSWORD" \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out "$OUT" /tmp/delonghi-exp/aligned.apk
          "$BUILD/apksigner" verify --verbose --print-certs --min-sdk-version 36 "$OUT" > /tmp/delonghi-exp/verify-36.txt
          "$BUILD/apksigner" verify --verbose --min-sdk-version 24 "$OUT" > /tmp/delonghi-exp/verify-24.txt
          "$BUILD/aapt" dump badging "$OUT" > /tmp/delonghi-exp/badging-signed.txt
          test "$(wc -c < "$OUT")" -lt 100000000
          echo 'Experimental only. Not proven to translate UI. Uses a DIFFERENT test signing key.' > releases/DeLonghi_Arabic_AssetPath_Experiment_Verification.txt
          echo 'Uninstalling existing beta may erase local data. Do not uninstall a working official app.' >> releases/DeLonghi_Arabic_AssetPath_Experiment_Verification.txt
          cat /tmp/delonghi-exp/patch-output.txt >> releases/DeLonghi_Arabic_AssetPath_Experiment_Verification.txt
          sha256sum "$OUT" >> releases/DeLonghi_Arabic_AssetPath_Experiment_Verification.txt
          cat /tmp/delonghi-exp/verify-36.txt >> releases/DeLonghi_Arabic_AssetPath_Experiment_Verification.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUT" releases/DeLonghi_Arabic_AssetPath_Experiment_Verification.txt
          git commit -m 'Add Arabic Flutter asset-route test APK without overwriting working beta'
          git fetch origin delonghi-arabic-talkback-apk
          git rebase origin/delonghi-arabic-talkback-apk
          git push origin HEAD:delonghi-arabic-talkback-apk
