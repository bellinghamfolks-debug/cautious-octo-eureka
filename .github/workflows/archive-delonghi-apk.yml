name: Archive owner-provided DeLonghi APK

on:
  push:
    branches:
      - delonghi-arabic-talkback-apk
    paths:
      - .github/workflows/archive-delonghi-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: delonghi-arabic-talkback-apk
          persist-credentials: true

      - name: Download owner-supplied APK and verify exact bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          file=releases/DeLonghi_MyCoffeeLounge_Arabic_ARM64_APK_Repaired_Experimental.apk
          curl --fail --location --show-error --silent \
            --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            --user-agent 'Mozilla/5.0 (compatible; APK-Archivist/1.0)' \
            'https://files.catbox.moe/ak0n10.apk' \
            --output "$file"
          echo "95a8534bae1326a074777c9b88bd6315c7bdef909ddf185964d129af5081c6a0  $file" | sha256sum --check --status
          test "$(wc -c < "$file")" -eq 99940341
          echo "Downloaded and verified: $(wc -c < "$file") bytes"

      - name: Commit binary on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/DeLonghi_MyCoffeeLounge_Arabic_ARM64_APK_Repaired_Experimental.apk
          if git diff --cached --quiet; then
            echo "APK already present"
            exit 0
          fi
          git commit -m 'Add owner-provided experimental DeLonghi Arabic APK (SHA-256 verified)'
          git push origin HEAD:delonghi-arabic-talkback-apk
